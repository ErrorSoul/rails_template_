# Omakase Ruby styling for Rails — inherit, don't replace.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Merge (not replace) AllCops/Exclude coming from RuboCop defaults and omakase,
# otherwise node_modules/tmp/vendor would start being linted.
inherit_mode:
  merge:
    - Exclude

# TargetRubyVersion is intentionally unset: RuboCop reads .ruby-version,
# so the target follows the app instead of drifting behind it.
